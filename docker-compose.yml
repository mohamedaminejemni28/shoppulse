name: shoppulse

services:
  ####################### postgres ##############################
  postgres:
    image: postgres:16-alpine
    container_name: shoppulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shoppulse}
      POSTGRES_USER: ${POSTGRES_USER:-shoppulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      TZ: Africa/Lagos
      PGTZ: Africa/Lagos
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/tests:/workspace-tests:ro
      - ./database/queries:/workspace-queries:ro
      - ./database/migrations:/workspace-migrations:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shoppulse} -d ${POSTGRES_DB:-shoppulse}" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - shoppulse-network
  ################################################pgadmin######################################
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: shoppulse-pgadmin
    restart: unless-stopped
    profiles: [ "tools" ]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@shoppulse.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD must be set in .env}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./database/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shoppulse-network

  ############################################################kestra-postgres##########################################
  kestra-postgres:
    image: postgres:16-alpine
    container_name: shoppulse-kestra-postgres
    restart: unless-stopped
    profiles: [ "orchestration" ]
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${KESTRA_DB_PASSWORD:?KESTRA_DB_PASSWORD must be set in .env}
      TZ: Africa/Lagos
      PGTZ: Africa/Lagos
    volumes:
      - kestra-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kestra -d kestra" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - shoppulse-network

  ####################################################kestra########################################
  kestra:
    image: kestra/kestra:latest
    container_name: shoppulse-kestra
    restart: unless-stopped
    profiles: [ "orchestration" ]
    user: "root"
    command: server standalone --worker-thread=32 --flow-path /app/flows --plugins /app/storage/plugins
    environment:
      ENV_SHOPPULSE_DB_URL: jdbc:postgresql://postgres:5432/shoppulse
      ENV_SHOPPULSE_DB_USER: ${POSTGRES_USER:-shoppulse}
      ENV_SHOPPULSE_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}

      ENV_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-shoppulse_admin}
      ENV_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}

      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://kestra-postgres:5432/kestra
            driver-class-name: org.postgresql.Driver
            username: kestra
            password: ${KESTRA_DB_PASSWORD:?KESTRA_DB_PASSWORD must be set in .env}
        kestra:
          server:
            basic-auth:
              username: ${KESTRA_ADMIN_EMAIL:?KESTRA_ADMIN_EMAIL must be set in .env}
              password: ${KESTRA_ADMIN_PASSWORD:?KESTRA_ADMIN_PASSWORD must be set in .env}
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8080/
    ports:
      - "127.0.0.1:${KESTRA_PORT:-8080}:8080"
    volumes:
      - kestra-data:/app/storage
      - ./orchestration/kestra/flows:/app/flows
    depends_on:
      kestra-postgres:
        condition: service_healthy
    networks:
      - shoppulse-network

  ####################################################minio########################################
  minio:
    image: docker.io/bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: shoppulse-minio
    restart: unless-stopped
    profiles: [ "datalake", "streaming", "batch" ]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-shoppulse_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
    volumes:
      - ./data-lake/minio:/bitnami/minio/data
    networks:
      - shoppulse-network

  ####################################################backend########################################
  backend:
    build:
      context: ./backend
    container_name: shoppulse-backend
    restart: unless-stopped
    profiles: [ "app" ]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shoppulse}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-shoppulse}
      SHOPPULSE_API_KEY: ${SHOPPULSE_API_KEY:?SHOPPULSE_API_KEY must be set in .env}
      KESTRA_URL: http://kestra:8080
      KESTRA_ADMIN_EMAIL: ${KESTRA_ADMIN_EMAIL:?KESTRA_ADMIN_EMAIL must be set in .env}
      KESTRA_ADMIN_PASSWORD: ${KESTRA_ADMIN_PASSWORD:?KESTRA_ADMIN_PASSWORD must be set in .env}
      TZ: Africa/Lagos
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - shoppulse-network

  ####################################################frontend########################################
  frontend:
    build:
      context: ./frontend
    container_name: shoppulse-frontend
    restart: unless-stopped
    profiles: [ "app" ]
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - shoppulse-network

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.latest
    container_name: shoppulse-dbt
    profiles: [ "analytics" ]
    environment:
      DBT_HOST: postgres
      DBT_PORT: 5432
      DBT_DATABASE: ${POSTGRES_DB:-shoppulse}
      DBT_USER: ${POSTGRES_USER:-shoppulse}
      DBT_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      DBT_SCHEMA: analytics_dbt
    volumes:
      - ./analytics/dbt:/usr/app
      - ./analytics/dbt/profiles.yml:/root/.dbt/profiles.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shoppulse-network

  ####################################################kafka########################################
  kafka:
    image: apache/kafka:3.9.1
    container_name: shoppulse-kafka
    restart: unless-stopped
    profiles: [ "streaming" ]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - shoppulse-network

  kafka-producer:
    build:
      context: ./streaming
    container_name: shoppulse-kafka-producer
    profiles: [ "streaming" ]
    command: python producer.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: shoppulse.events
      EVENT_COUNT: ${KAFKA_EVENT_COUNT:-100}
      EVENT_DELAY_SECONDS: ${KAFKA_EVENT_DELAY_SECONDS:-0.05}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - shoppulse-network

  kafka-to-minio:
    build:
      context: ./streaming
    container_name: shoppulse-kafka-to-minio
    restart: unless-stopped
    profiles: [ "streaming" ]
    command: python consumer_to_minio.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: shoppulse.events
      KAFKA_CONSUMER_GROUP: shoppulse-datalake-writer-v1
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-shoppulse_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
      MINIO_BUCKET: shoppulse
      BATCH_SIZE: ${KAFKA_ARCHIVE_BATCH_SIZE:-25}
      FLUSH_SECONDS: ${KAFKA_ARCHIVE_FLUSH_SECONDS:-10}
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - shoppulse-network

  ####################################################spark########################################
  spark-batch:
    build:
      context: ./processing/spark
    container_name: shoppulse-spark-batch
    profiles: [ "batch" ]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-shoppulse_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
      MINIO_BUCKET: shoppulse
      SPARK_MASTER: local[*]
    depends_on:
      minio:
        condition: service_started
    volumes:
      - spark-work:/work
    networks:
      - shoppulse-network

volumes:
  postgres-data:
    name: shoppulse-postgres-data-v2

  pgadmin-data:
    name: shoppulse-pgadmin-data

  kestra-postgres-data:
    name: shoppulse-kestra-postgres-data

  kestra-data:
    name: shoppulse-kestra-data

  spark-work:
    name: shoppulse-spark-work

networks:
  shoppulse-network:
    name: shoppulse-network
